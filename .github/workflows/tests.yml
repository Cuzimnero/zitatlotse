name: Isolated tests and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Backend tests without model downloads or API calls
        shell: pwsh
        run: |
          $env:ZQS_DB = Join-Path $env:RUNNER_TEMP 'zitatlotse-tests.sqlite'
          $env:HF_HUB_OFFLINE = '1'
          python -m unittest discover -s backend -p "test_*.py"
      - name: Plugin tests
        run: node test_plugin.js
      - name: Session and result display tests
        run: node test_search_session.js
      - name: Build installable add-on and source archive
        run: python package.py
